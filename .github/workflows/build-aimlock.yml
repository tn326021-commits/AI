name: Build AimLock.dat (Ultra)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate AimLock.dat
        run: |
          python scripts/generate_aimlock.py
          ls -lh output/AimLock.dat
          xxd -l 16 output/AimLock.dat
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then echo "No changes."; else git commit -m "Auto-Build: AimLock.dat (Ultra) [Skip CI]"; git push; fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimlock-dat
          path: output/
          retention-days: 30
