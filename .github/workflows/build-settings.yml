name: Build Optimize Settings File

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate optimize.settings
        run: |
          python scripts/generate_settings.py
          echo "=== Kiểm tra file ==="
          ls -lh output/optimize.settings
          echo "=== 16 bytes đầu (đã mã hóa) ==="
          xxd -l 16 output/optimize.settings

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "Auto-Build: Cập nhật optimize.settings (Obfuscated) [Skip CI]"
            git push
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimize-settings
          path: output/
          retention-days: 30
