name: Build IFix Hotfix Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Compile IFix C# Script
      run: python scripts/compile_cs.py

    - name: Patch Bundle
      run: python scripts/patch_bundle.py

    - name: Upload Patched Bundle
      uses: actions/upload-artifact@v4
      with:
        name: ifix-patched-bundle
        path: output/modified.bundle
