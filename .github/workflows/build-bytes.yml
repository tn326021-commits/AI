name: Build and Merge AimAssist

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compile AimAssist to DLL
      run: |
        dotnet new classlib -n AimAssistProject -o temp_build
        cp src/AimAssist.cs temp_build/Class1.cs
        cp src/UnityStub.cs temp_build/UnityStub.cs
        cd temp_build
        dotnet build -c Release
        cp bin/Release/*/AimAssistProject.dll ../AimAssistAssembly.dll
        cd ..

    - name: Append DLL to bytes file
      run: |
        mkdir -p output
        # Nối file patch gốc và file DLL mới thành 1 file duy nhất
        cat input/Assembly-CSharp-patch.bytes AimAssistAssembly.dll > output/Assembly-CSharp-merged.bytes
        echo "[OK] Đã nối file thành công!"

    - name: Upload Final Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AimAssist-Patched-Bundle
        path: output/Assembly-CSharp-merged.bytes
