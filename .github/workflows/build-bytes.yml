name: Build and Clean AimAssist

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Compile AimAssist to DLL
      run: |
        dotnet new classlib -n AimAssistProject -o temp_build
        cp src/AimAssist.cs temp_build/Class1.cs
        cp src/UnityStub.cs temp_build/UnityStub.cs
        cd temp_build
        dotnet build -c Release
        cp bin/Release/*/AimAssistProject.dll ../AimAssistAssembly.dll
        cd ..

    - name: Overwrite Bytes File (Clean)
      run: |
        python scripts/overwrite_bytes.py

    - name: Upload Final Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AimAssist-Clean-Bytes
        path: output/Assembly-CSharp-clean.bytes
