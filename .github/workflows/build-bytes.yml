name: Build AssetBundle from DLL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Mã nguồn Checkout
      uses: actions/checkout@v4

    - name: Cài đặt Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện UnityPy
      run: |
        python -m pip install --upgrade pip
        pip install UnityPy

    - name: Chạy script đóng gói AssetBundle
      run: |
        python scripts/package_dll.py

    - name: Lưu trữ hoặc Upload file AssetBundle (.asset) kết quả
      uses: actions/upload-artifact@v4
      with:
        name: AimDrag-AssetBundle
        path: AimDrag.asset
