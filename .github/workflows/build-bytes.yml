name: Merge and Patch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install pythonnet

    - name: Compile AimAssist to DLL
      run: |
        dotnet new classlib -n AimAssistProject -o temp_build
        cp nguồn/AimAssist.cs temp_build/Class1.cs
        cd temp_build
        dotnet build -c Release
        cp bin/Release/net7.0/AimAssistProject.dll ../AimAssistAssembly.dll

    - name: Merge DLLs
      run: |
        python kịch bản/merge_dll.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: merged-bytes
        path: đầu ra/Assembly-CSharp-merged.bytes
