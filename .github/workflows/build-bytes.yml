name: Patch IFix Bytes with Mod Menu

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Patch and Pack Bytes
      run: |
        python scripts/patch_bytes.py

    - name: Upload Final Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Patched-Menu-Bytes
        path: output/Assembly-CSharp-patch.bytes
