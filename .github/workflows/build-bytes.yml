name: Create IFix Patch

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

# Cấp quyền ghi cho GitHub Actions
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Compile AimAssist to DLL
      run: |
        dotnet new classlib -n AimAssistProject -o temp_build
        cp src/AimAssist.cs temp_build/Class1.cs
        cp src/UnityStub.cs temp_build/UnityStub.cs
        cd temp_build
        dotnet build -c Release
        cp bin/Release/*/AimAssistProject.dll ../AimAssistAssembly.dll
        cd ..

    - name: Create IFix Patch File
      run: |
        python scripts/overwrite_bytes.py

    # BƯỚC MỚI: Tự động commit file kết quả vào thư mục output/
    - name: Commit and Push Output File
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add output/Assembly-CSharp-patch.bytes
        # Kiểm tra xem có thay đổi không trước khi commit
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Generated IFix Patch with AimAssist Menu"
        git push

    - name: Upload Final Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IFix-Patch-Bytes
        path: output/Assembly-CSharp-patch.bytes
