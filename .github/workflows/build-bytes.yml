name: Build and Merge AimAssist

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm chạy thủ công từ tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        pip install pythonnet

    - name: Compile AimAssist to DLL
      run: |
        # 1. Tạo project C# tạm thời
        dotnet new classlib -n AimAssistProject -o temp_build
        
        # 2. Copy cả code chính và file giả lập Unity vào project
        cp src/AimAssist.cs temp_build/Class1.cs
        cp src/UnityStub.cs temp_build/UnityStub.cs
        
        # 3. Tiến hành biên dịch
        cd temp_build
        dotnet build -c Release
        
        # 4. Copy file DLL kết quả ra thư mục gốc để Python xử lý
        cp bin/Release/net7.0/AimAssistProject.dll ../AimAssistAssembly.dll

    - name: Download dnlib for Merging
      run: |
        wget https://github.com/0xd4d/dnlib/releases/download/v4.3.0/dnlib.dll

    - name: Merge DLLs with Original Patch
      run: |
        # Chạy script Python để gộp file
        python scripts/merge_dll.py

    - name: Upload Final Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AimAssist-Patched-Bundle
        path: output/Assembly-CSharp-merged.bytes
