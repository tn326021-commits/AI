name: Build and Commit AssetBundle

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install UnityPy

    - name: Create AssetBundle
      run: |
        # Chạy script trong thư mục 'kịch bản'
        python "scripts/create_bundle.py"

    - name: Commit and Push AssetBundle
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        echo "--- Kiểm tra thư mục đầu ra ---"
        ls -la "đầu ra/" || true
        
        # Thêm file với đường dẫn có dấu
        git add -f "output/aimmenu_bundle" || true
        
        git commit -m "Auto-update: Generated AimMenu AssetBundle" || echo "Không có gì để commit"
        git push || echo "Không có gì để push"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AimMenu-Bundle
        path: "output/aimmenu_bundle"
