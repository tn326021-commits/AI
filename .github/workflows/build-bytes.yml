name: Build Hitbox x3 Patch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Compile C# to DLL
      run: |
        # Tạo project tạm để build
        dotnet new classlib -n AimAssistProject -o temp_build
        cp nguồn/AimAssist.cs temp_build/Class1.cs
        
        # Thêm reference (Bạn cần đảm bảo đã up các file .dll của game vào thư mục 'nguồn' hoặc 'libs')
        # dotnet add temp_build/AimAssistProject.csproj reference nguồn/IFix.Core.dll
        # dotnet add temp_build/AimAssistProject.csproj reference nguồn/Assembly-CSharp.dll
        # dotnet add temp_build/AimAssistProject.csproj reference nguồn/UnityEngine.CoreModule.dll
        
        cd temp_build
        dotnet build -c Release
        # Copy file DLL ra ngoài thư mục gốc để script Python tìm thấy
        cp bin/Release/net7.0/AimAssistProject.dll ../AimAssistAssembly.dll

    - name: Run Python Patch Script
      run: |
        python kịch bản/inject_bytes.py

    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: Hitbox-x3-Patch
        path: đầu ra/Assembly-CSharp-hitbox_x3.bytes
