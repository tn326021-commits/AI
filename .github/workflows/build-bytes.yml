name: Build and Patch AssetBundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Mono (C# Compiler)
      run: |
        sudo apt-get update
        sudo apt-get install -y mono-mcs

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt

    - name: Compile C# to DLL
      run: python scripts/compile_cs.py

    - name: Patch AssetBundle with UnityPy
      run: python scripts/patch_bundle.py

    - name: Upload Modified Bundle
      uses: actions/upload-artifact@v4
      with:
        name: patched-bundle
        path: output/modified.bundle
