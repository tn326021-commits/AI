name: Build and Merge AimAssist

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm chạy thủ công từ tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Sử dụng .NET 8 cho ổn định

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        pip install pythonnet

    - name: Compile AimAssist to DLL
      run: |
        # 1. Tạo project C# tạm thời
        dotnet new classlib -n AimAssistProject -o temp_build
        
        # 2. Copy cả code chính và file giả lập Unity vào project
        cp src/AimAssist.cs temp_build/Class1.cs
        cp src/UnityStub.cs temp_build/UnityStub.cs
        
        # 3. Tiến hành biên dịch
        cd temp_build
        dotnet build -c Release
        
        # 4. Copy file DLL kết quả ra thư mục gốc (dùng dấu * để tự động tìm net8.0)
        cp bin/Release/*/AimAssistProject.dll ../AimAssistAssembly.dll
        cd ..

    - name: Download dnlib for Merging
      run: |
        # Tải dnlib từ NuGet (tránh lỗi link Github bị xóa)
        dotnet new console -n TempDownloader -o temp_downloader
        cd temp_downloader
        dotnet add package dnlib --version 4.3.0
        dotnet build -c Release
        cp bin/Release/*/dnlib.dll ../dnlib.dll
        cd ..

    - name: Merge DLLs with Original Patch
      run: |
        # Chạy script Python để gộp file
        python scripts/merge_dll.py

    - name: Upload Final Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AimAssist-Patched-Bundle
        path: output/Assembly-CSharp-merged.bytes
