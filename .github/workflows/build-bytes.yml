name: Build AimLock.bytes (Unity TextAsset)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate AimLock.bytes
        run: |
          python scripts/generate_bytes.py
          echo "=== Kiểm tra nội dung (đọc trực tiếp) ==="
          head -c 200 output/AimLock.bytes

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "Auto-Build: AimLock.bytes (Unity TextAsset) [Skip CI]"
            git push
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimlock-bytes
          path: output/
          retention-days: 30
